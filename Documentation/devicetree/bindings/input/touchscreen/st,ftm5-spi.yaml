%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/st,ftm5-spi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STMicroelectronics FTM5 FingerTip touchscreen controller (SPI)

maintainers:
  - Local Diting bring-up <ubuntu-diting@localhost>

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: st,ftm5-spi

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  vdd-supply:
    description: Digital I/O supply

  avdd-supply:
    description: Analog supply

  spi-max-frequency:
    maximum: 12000000

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios
  - vdd-supply
  - avdd-supply
  - touchscreen-size-x
  - touchscreen-size-y

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "st,ftm5-spi";
            reg = <0>;
            spi-max-frequency = <12000000>;
            interrupts-extended = <&tlmm 21 IRQ_TYPE_LEVEL_LOW>;
            reset-gpios = <&tlmm 20 GPIO_ACTIVE_LOW>;
            vdd-supply = <&vreg_l2c_1p8>;
            avdd-supply = <&ts_avdd>;
            touchscreen-size-x = <12200>;
            touchscreen-size-y = <27120>;
        };
    };
