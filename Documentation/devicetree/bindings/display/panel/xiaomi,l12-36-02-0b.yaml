%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/xiaomi,l12-36-02-0b.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xiaomi 12T Pro "36 02 0b" 1220x2712 DSC command mode AMOLED panel

maintainers:
  - Local Diting bring-up <ubuntu-diting@localhost>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: xiaomi,l12-36-02-0b

  reg:
    maxItems: 1

  vddio-supply:
    description: 1.8 V I/O supply

  vddd-supply:
    description: 1.2 V digital core supply

  vci-supply:
    description: 3.0 V analog supply

required:
  - compatible
  - reg
  - reset-gpios
  - vddio-supply
  - vddd-supply
  - vci-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "xiaomi,l12-36-02-0b";
            reg = <0>;
            reset-gpios = <&tlmm 0 GPIO_ACTIVE_LOW>;
            vddio-supply = <&vreg_l12c_1p8>;
            vddd-supply = <&panel_vddd>;
            vci-supply = <&vreg_l13c_3p0>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&mdss_dsi0_out>;
                };
            };
        };
    };
